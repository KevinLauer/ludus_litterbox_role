---
# Defaults file for ludus_litterbox

# Enable or disable LitterBox installation
ludus_litterbox_install: true

# Installation directory for LitterBox
ludus_litterbox_install_dir: "C:\\Tools\\LitterBox"

ludus_litterbox_python_version: "3.12.0"
ludus_litterbox_python_winget_id: Python.Python.3.12
ludus_litterbox_python_install_override: "InstallAllUsers=1 PrependPath=1 TargetDir=C:\\Python312 /quiet"
ludus_litterbox_python_executable: "C:\\Python312\\python.exe"
ludus_litterbox_install_python: true
ludus_litterbox_git_winget_id: Git.Git
ludus_litterbox_winget_ok_rc:
  - 0
  - -1978335135
  - -1978334963
  - -1978335189
  - 2316632161
  - 2316632333
  - 2316632107
ludus_litterbox_winget_build_packages:
  - id: Microsoft.VCRedist.2015+.x64
  - id: Microsoft.DotNet.Framework.DeveloperPack_4
  - id: Microsoft.VisualStudio.2022.BuildTools
    override: "--wait --passive --add Microsoft.VisualStudio.Workload.VCTools --includeRecommended"
  - id: Microsoft.WindowsSDK.10.0.22621
ludus_litterbox_app_dir: "{{ ludus_litterbox_install_dir }}\\LitterBox"
ludus_litterbox_tools_dir: "C:\\Tools"

# LitterBox repository URL
ludus_litterbox_repo_url: "https://github.com/BlackSnufkin/LitterBox.git"

# LitterBox server configuration
ludus_litterbox_host: "0.0.0.0"
ludus_litterbox_port: 1337
ludus_litterbox_enable_mcp: true
ludus_litterbox_mcp_host: "0.0.0.0"
ludus_litterbox_mcp_port: 8765
ludus_litterbox_enable_whiskers: true
ludus_litterbox_whiskers_host: "0.0.0.0"
ludus_litterbox_whiskers_port: 8080
ludus_litterbox_whiskers_download_url: "https://github.com/BlackSnufkin/LitterBox/releases/latest/download/Whiskers.exe"

# Windows Defender exclusions for malware analysis
ludus_litterbox_defender_exclusions: true

# Require administrator privileges check
ludus_litterbox_require_admin: true

# Enable or disable firewall rule creation
ludus_litterbox_firewall_rule: true

# Enable or disable desktop shortcut creation
ludus_litterbox_desktop_shortcut: true

# Enable debug mode
ludus_litterbox_debug: false

# Analysis configuration
ludus_litterbox_analysis_timeout: 300 # seconds
ludus_litterbox_max_file_size: 104857600 # 100MB in bytes
ludus_litterbox_allowed_extensions:
  - exe
  - dll
  - sys
  - scr
  - com
  - bat
  - ps1
  - vbs
  - js
  - doc
  - docx
  - xls
  - xlsx
  - ppt
  - pptx
  - pdf
  - lnk

# Feature flags
ludus_litterbox_enable_static: true
ludus_litterbox_enable_dynamic: true
ludus_litterbox_enable_holygrail: true
ludus_litterbox_enable_doppelganger: true
ludus_litterbox_enable_yara: true

# Logging configuration
ludus_litterbox_log_level: "INFO"
ludus_litterbox_log_max_size: 10485760 # 10MB
ludus_litterbox_log_backup_count: 5

# Advanced settings
ludus_litterbox_workers: 4
ludus_litterbox_process_monitor_interval: 5
ludus_litterbox_memory_scan_interval: 10
ludus_litterbox_cleanup_days: 30
ludus_litterbox_enable_telemetry: false

ludus_litterbox_disable_defender: false

# Boot litterbox on start
ludus_litterbox_autostart: true

ludus_litterbox_elastic_enabled: true
ludus_litterbox_elastic_agent_ip: "127.0.0.1"
ludus_litterbox_elastic_agent_port: 8080
ludus_litterbox_elastic_url: ""
ludus_litterbox_elastic_apikey: ""
ludus_litterbox_elastic_auto_apikey: true
ludus_litterbox_elastic_username: "elastic"
ludus_litterbox_elastic_password: ""
ludus_litterbox_elastic_verify_tls: false
ludus_litterbox_elastic_wait_alerts: 90
ludus_litterbox_elastic_av_block_wait: 60
ludus_litterbox_elastic_exec_timeout: 60
