---
- name: Generate Elasticsearch API key from this Windows VM
  ansible.windows.win_shell: |
    [System.Net.ServicePointManager]::ServerCertificateValidationCallback = {$true}
    [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.SecurityProtocolType]::Tls12 -bor [System.Net.SecurityProtocolType]::Tls13
    $auth = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("{{ ludus_litterbox_elastic_username }}:{{ ludus_litterbox_elastic_password }}"))
    $headers = @{
      "Authorization" = "Basic $auth"
      "Content-Type"  = "application/json"
    }
    $body = @{
      name = "litterbox-{{ inventory_hostname | lower }}"
      role_descriptors = @{
        litterbox_reader = @{
          cluster = @("monitor")
          indices = @(
            @{
              names = @(
                ".alerts-security.alerts-*",
                ".internal.alerts-security.alerts-*",
                ".ds-logs-endpoint.alerts-*"
              )
              privileges = @("read", "view_index_metadata")
            }
          )
        }
      }
    } | ConvertTo-Json -Depth 5
    $resp = Invoke-RestMethod -Uri "https://{{ ludus_litterbox_elastic_url }}/_security/api_key" -Method Post -Headers $headers -Body $body -TimeoutSec 20
    Write-Output $resp.encoded
  register: win_generated_apikey
  no_log: true
  failed_when: false

- name: Fallback generate Elasticsearch API key on the container VM
  ansible.builtin.shell: |
    curl -k -s -u "{{ ludus_litterbox_elastic_username }}:{{ ludus_litterbox_elastic_password }}" \
      -X POST "https://127.0.0.1:9200/_security/api_key" \
      -H "Content-Type: application/json" \
      -d '{"name":"litterbox-{{ inventory_hostname | lower }}","role_descriptors":{"litterbox_reader":{"cluster":["monitor"],"indices":[{"names":[".alerts-security.alerts-*",".internal.alerts-security.alerts-*",".ds-logs-endpoint.alerts-*"],"privileges":["read","view_index_metadata"]}]}}}'
  register: linux_generated_apikey
  delegate_to: "{{ discovered_elastic_vm.vm_name }}"
  no_log: true
  failed_when: false
  when:
    - (win_generated_apikey.stdout | default('') | trim) == ""
    - discovered_elastic_vm is defined
    - discovered_elastic_vm != None
    - discovered_elastic_vm.vm_name is defined

- name: Set API key from Windows response
  ansible.builtin.set_fact:
    ludus_litterbox_elastic_apikey: "{{ win_generated_apikey.stdout | trim }}"
  no_log: true
  when: (win_generated_apikey.stdout | default('') | trim) | length > 10

- name: Set API key from container VM response
  ansible.builtin.set_fact:
    ludus_litterbox_elastic_apikey: "{{ (linux_generated_apikey.stdout | from_json).encoded }}"
  no_log: true
  when:
    - ludus_litterbox_elastic_apikey | length == 0
    - linux_generated_apikey is defined
    - linux_generated_apikey.stdout is defined
    - linux_generated_apikey.stdout | length > 0
