---
# Tasks to configure Elastic Defend EDR profile for LitterBox

- name: Generate Elasticsearch API key automatically
  ansible.builtin.include_tasks: elastic_apikey.yml
  when:
    - ludus_litterbox_elastic_auto_apikey | default(true)
    - ludus_litterbox_elastic_apikey | length == 0

- name: Validate Elasticsearch API key is available
  ansible.builtin.assert:
    that:
      - ludus_litterbox_elastic_apikey | length > 0
    fail_msg: >-
      No Elasticsearch API key available. Either set ludus_litterbox_elastic_apikey manually,
      or provide ludus_litterbox_elastic_username and ludus_litterbox_elastic_password
      for automatic key generation.

- name: Create EDR profiles directory
  ansible.windows.win_file:
    path: "{{ ludus_litterbox_install_dir }}\\LitterBox\\Config\\edr_profiles"
    state: directory

- name: Deploy Elastic Defend EDR profile
  ansible.windows.win_template:
    src: elastic_profile.yml.j2
    dest: "{{ ludus_litterbox_install_dir }}\\LitterBox\\Config\\edr_profiles\\elastic.yml"
    backup: true

- name: Restart LitterBox to load EDR profile
  ansible.windows.win_shell: |
    schtasks /end /tn "LITTERBOX"
    Start-Sleep -Seconds 3
    schtasks /run /tn "LITTERBOX"
  ignore_errors: true

- name: Display Elastic profile configuration
  ansible.builtin.debug:
    msg:
      - "Elastic Defend EDR profile configured!"
      - "Whiskers agent: http://{{ ludus_litterbox_elastic_agent_ip }}:{{ ludus_litterbox_elastic_agent_port }}"
      - "Elastic URL: https://{{ ludus_litterbox_elastic_url }}"
      - "Profile path: {{ ludus_litterbox_install_dir }}\\LitterBox\\Config\\edr_profiles\\elastic.yml"
      - "LitterBox has been restarted to load the new profile."
